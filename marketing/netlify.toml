# Static marketing site on Netlify
# Site settings: Base directory = marketing
#
# Build writes api-config.js from STW_API_BASE (see README.md in this folder).
# A build command set in the Netlify UI overrides this file — leave it empty,
# or set it to: node inject-api-base.mjs

[build]
  command = "node inject-api-base.mjs"
  publish = "."

[build.environment]
  STW_API_BASE = "https://api.splitthewine.app"

[[redirects]]
  from = "/faq"
  to = "/faq.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200

[[redirects]]
  from = "/coming-soon"
  to = "/coming-soon.html"
  status = 200

# Force apex → www (also set www as primary domain in Netlify UI)
[[redirects]]
  from = "https://splitthewine.app/*"
  to = "https://www.splitthewine.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://splitthewine.app/*"
  to = "https://www.splitthewine.app/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Each deploy should pick up a new STW_API_BASE immediately.
[[headers]]
  for = "/api-config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
