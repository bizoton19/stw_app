<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split the Wine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        merlot: '#6E2E35',
                        paper: '#F6F4F1',
                        ink: '#2A241C',
                        inkSoft: '#7A7268',
                        muted: '#8A847C',
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F6F4F1;
            color: #2A241C;
            scroll-behavior: smooth;
        }

        /* Simple Animations */
        .fade-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Floating receipt animation */
        .float-receipt {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Bottle splitting animation on hover */
        .wine-mark .segment {
            transform-origin: center;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .wine-mark {
            transform: rotate(-15deg);
            overflow: visible;
        }

        .group:hover .wine-mark .seg-top {
            transform: translate(-3px, -4px) rotate(-8deg);
        }
        .group:hover .wine-mark .seg-bottom {
            transform: translate(3px, 4px) rotate(4deg);
        }
</head>
<body class="antialiased min-h-screen flex flex-col selection:bg-merlot selection:text-white">

    <!-- Navigation -->
    <nav class="max-w-5xl mx-auto w-full px-6 py-8 flex justify-between items-center fade-up group">
        <div class="flex items-center gap-2">
            <!-- WineMark SVG with hover split animation -->
            <svg width="42" height="42" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" class="wine-mark">
                <!-- cork -->
                <path d="M22.2 3.5h3.6v3.2h-3.6V3.5Z" fill="#6E2E35" class="segment seg-top" />
                <!-- neck -->
                <path d="M21.4 6.7h5.2v6.8h-5.2V6.7Z" fill="#6E2E35" class="segment seg-top" />
                <!-- shoulder -->
                <path d="M16.5 13.5h15v5.2l-2.2 1.1-2.4-1.3-2.6 1.4-2.5-1.2-2.3 1.2-3-1.2V13.5Z" fill="#6E2E35" class="segment seg-top" />
                <!-- body 1 -->
                <path d="M16.5 21.2l3 .9 2.3-1.1 2.5 1.2 2.6-1.3 2.4 1.2 2.2-1 0 5.4-2.1 1.1-2.5-1.2-2.5 1.3-2.6-1.2-2.4 1.1-2.9-1.1v-5.3Z" fill="#6E2E35" class="segment seg-top" />
                <!-- body 2 -->
                <path d="M16.5 28.8l2.9.9 2.4-1.1 2.6 1.2 2.5-1.2 2.5 1.1 2.1-.9v5.5l-2 .9-2.6-1.1-2.5 1.2-2.6-1.2-2.4 1.1-2.9-.9v-5.4Z" fill="#6E2E35" class="segment seg-bottom" />
                <!-- base -->
                <path d="M16.5 36.4l2.9.8 2.4-1 2.6 1.1 2.5-1.1 2.6 1.1 2-.8v5.2a3 3 0 0 1-3 3H19.5a3 3 0 0 1-3-3v-5.3Z" fill="#6E2E35" class="segment seg-bottom" />
            </svg>
            <span class="font-bold text-2xl tracking-tight">Split the Wine</span>
        </div>
        <div>
            <a href="#how-it-works" class="text-sm font-semibold text-inkSoft hover:text-merlot transition-colors">How it works</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <main class="flex-1 flex flex-col items-center justify-center px-6 pt-12 pb-24 text-center">
        <h1 class="text-5xl md:text-7xl font-bold tracking-tight text-ink max-w-4xl fade-up delay-100">
            Split the tab. <br/>
            <span class="text-merlot">Skip the math.</span>
        </h1>
        <p class="mt-6 text-lg md:text-xl text-inkSoft max-w-2xl fade-up delay-200">
            Photograph the check. Friends claim what they ordered. Pay the host — we never touch the money, and we don't need your social graph.
        </p>
        
        <!-- App Store Badges -->
        <div class="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4 fade-up delay-300">
            <a href="#" class="transition-transform hover:-translate-y-0.5 hover:opacity-90">
                <img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83&amp;releaseDate=1276560000" alt="Download on the App Store" style="height: 48px; border-radius: 8px;">
            </a>
            <a href="#" class="transition-transform hover:-translate-y-0.5 hover:opacity-90">
                <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play" style="height: 68px; margin-top: -10px; margin-bottom: -10px;">
            </a>
        </div>

        <!-- Privacy highlight -->
        <div class="mt-8 inline-flex items-center gap-2 bg-[#E6E0D8] bg-opacity-40 px-4 py-2 rounded-full fade-up delay-300">
            <i data-lucide="shield-check" class="w-4 h-4 text-merlot"></i>
            <span class="text-sm font-medium text-inkSoft">No accounts required. Links expire. Total privacy.</span>
        </div>
    </main>

    <!-- Steps Section -->
    <section id="how-it-works" class="bg-white py-24 px-6 border-t border-[#E6E0D8]">
        <div class="max-w-5xl mx-auto">
            <h2 class="text-3xl md:text-4xl font-bold text-center mb-16">Four steps. Zero friction.</h2>
            
            <div class="grid md:grid-cols-4 gap-8">
                <!-- Step 1 -->
                <div class="flex flex-col items-center text-center">
                    <div class="w-16 h-16 rounded-2xl bg-paper flex items-center justify-center mb-6 shadow-sm border border-[#E6E0D8]">
                        <i data-lucide="camera" class="w-8 h-8 text-merlot"></i>
                    </div>
                    <h3 class="text-lg font-bold mb-2">1. Snap the Check</h3>
                    <p class="text-inkSoft text-sm leading-relaxed">
                        Take a photo. Our AI reads the line items and prices instantly. You just confirm it looks right.
                    </p>
                </div>

                <!-- Step 2 -->
                <div class="flex flex-col items-center text-center">
                    <div class="w-16 h-16 rounded-2xl bg-paper flex items-center justify-center mb-6 shadow-sm border border-[#E6E0D8]">
                        <i data-lucide="share" class="w-8 h-8 text-merlot"></i>
                    </div>
                    <h3 class="text-lg font-bold mb-2">2. Drop the Link</h3>
                    <p class="text-inkSoft text-sm leading-relaxed">
                        Send the link in your group chat. Guests open it in their browser—no app download required.
                    </p>
                </div>

                <!-- Step 3 -->
                <div class="flex flex-col items-center text-center">
                    <div class="w-16 h-16 rounded-2xl bg-paper flex items-center justify-center mb-6 shadow-sm border border-[#E6E0D8]">
                        <i data-lucide="mouse-pointer-click" class="w-8 h-8 text-merlot"></i>
                    </div>
                    <h3 class="text-lg font-bold mb-2">3. Claim Drinks and Food</h3>
                    <p class="text-inkSoft text-sm leading-relaxed">
                        Everyone taps what they ordered. Tax and tip are calculated proportionally automatically.
                    </p>
                </div>

                <!-- Step 4 -->
                <div class="flex flex-col items-center text-center">
                    <div class="w-16 h-16 rounded-2xl bg-paper flex items-center justify-center mb-6 shadow-sm border border-[#E6E0D8]">
                        <i data-lucide="smartphone-nfc" class="w-8 h-8 text-merlot"></i>
                    </div>
                    <h3 class="text-lg font-bold mb-2">4. Settle Up</h3>
                    <p class="text-inkSoft text-sm leading-relaxed mb-4">
                        Guests tap to pay. We open your preferred app pre-filled. We never hold your funds.
                    </p>
                    <div class="flex flex-wrap justify-center gap-2 mt-auto">
                        <span class="inline-flex items-center gap-1.5 bg-[#008CFF]/10 text-[#008CFF] px-2 py-1 rounded text-xs font-semibold">Venmo</span>
                        <span class="inline-flex items-center gap-1.5 bg-[#00D632]/10 text-[#00D632] px-2 py-1 rounded text-xs font-semibold">Cash App</span>
                        <span class="inline-flex items-center gap-1.5 bg-[#6D1ED4]/10 text-[#6D1ED4] px-2 py-1 rounded text-xs font-semibold">Zelle</span>
                        <span class="inline-flex items-center gap-1.5 bg-[#003087]/10 text-[#003087] px-2 py-1 rounded text-xs font-semibold">PayPal</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Ephemeral/Privacy Callout -->
    <section class="bg-merlot text-paper py-24 px-6">
        <div class="max-w-4xl mx-auto text-center">
            <h2 class="text-3xl md:text-4xl font-bold mb-6">Your data isn't the product.</h2>
            <p class="text-lg opacity-90 max-w-2xl mx-auto leading-relaxed mb-10">
                You already have a group chat. We don't need your contacts or your social graph. 
                Split the Wine uses ephemeral links designed for tonight's dinner. Once the tab is settled, the link vanishes.
            </p>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-left">
                <div class="bg-white/10 p-6 rounded-2xl backdrop-blur-sm">
                    <i data-lucide="user-x" class="w-6 h-6 mb-4 text-paper opacity-80"></i>
                    <h4 class="font-bold mb-2 text-lg">No Guest Accounts</h4>
                    <p class="text-sm opacity-80">Only the host needs the app. Guests claim via the web in seconds without signing up.</p>
                </div>
                <div class="bg-white/10 p-6 rounded-2xl backdrop-blur-sm">
                    <i data-lucide="timer-off" class="w-6 h-6 mb-4 text-paper opacity-80"></i>
                    <h4 class="font-bold mb-2 text-lg">Short-lived Tabs</h4>
                    <p class="text-sm opacity-80">Receipt links expire automatically. We don't build a ledger of your spending history.</p>
                </div>
                <div class="bg-white/10 p-6 rounded-2xl backdrop-blur-sm">
                    <i data-lucide="wallet" class="w-6 h-6 mb-4 text-paper opacity-80"></i>
                    <h4 class="font-bold mb-2 text-lg">Direct Payments</h4>
                    <p class="text-sm opacity-80">We don't process payments or take a cut. Money moves directly between your existing apps.</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-paper py-12 px-6 border-t border-[#E6E0D8] text-center">
        <div class="flex justify-center items-center gap-2 opacity-50 mb-4 hover:opacity-100 transition-opacity">
            <svg width="20" height="20" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.2 3.5h3.6v3.2h-3.6V3.5Z" fill="#2A241C" />
                <path d="M21.4 6.7h5.2v6.8h-5.2V6.7Z" fill="#2A241C" />
                <path d="M16.5 13.5h15v5.2l-2.2 1.1-2.4-1.3-2.6 1.4-2.5-1.2-2.3 1.2-3-1.2V13.5Z" fill="#2A241C" />
                <path d="M16.5 21.2l3 .9 2.3-1.1 2.5 1.2 2.6-1.3 2.4 1.2 2.2-1 0 5.4-2.1 1.1-2.5-1.2-2.5 1.3-2.6-1.2-2.4 1.1-2.9-1.1v-5.3Z" fill="#2A241C" />
                <path d="M16.5 28.8l2.9.9 2.4-1.1 2.6 1.2 2.5-1.2 2.5 1.1 2.1-.9v5.5l-2 .9-2.6-1.1-2.5 1.2-2.6-1.2-2.4 1.1-2.9-.9v-5.4Z" fill="#2A241C" />
                <path d="M16.5 36.4l2.9.8 2.4-1 2.6 1.1 2.5-1.1 2.6 1.1 2-.8v5.2a3 3 0 0 1-3 3H19.5a3 3 0 0 1-3-3v-5.3Z" fill="#2A241C" />
            </svg>
            <span class="font-bold text-ink">Split the Wine</span>
        </div>
        <p class="text-sm text-inkSoft mb-4">Built for the table, not the ledger.</p>
        <div class="flex justify-center gap-4 text-xs text-inkSoft">
            <a href="privacy.html" class="hover:text-merlot transition-colors">Privacy Policy</a>
        </div>
    </footer>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
