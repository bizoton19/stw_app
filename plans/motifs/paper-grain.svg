<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <title>Paper grain  tileable linen tooth. Guide §4 caps this at 24% opacity.</title>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="noise" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <rect width="120" height="120" filter="url(#grain)" opacity="0.5" />
</svg>
